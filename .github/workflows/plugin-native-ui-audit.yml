name: Plugin native UI audit
on:
  push:
    paths:
      - "tools/ui_audit/**"
      - ".github/workflows/plugin-native-ui-audit.yml"
  workflow_dispatch:
    inputs:
      plugin:
        description: "Plugin directory (for example plugins/T5577_multiwriter)"
        required: true
        type: string
      strict:
        description: "Fail if definite layout/reference errors are found"
        type: boolean
        default: false
      references:
        description: "Optional repository directory with state_EN.png and state_FR.png"
        required: false
        type: string
  pull_request:
    paths:
      - "tools/ui_audit/**"
      - "src/lib/json_renderer.py"
      - "src/lib/resources.py"
      - "src/lib/_constants.py"
jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install native Tk runtime and image dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb python3-tk ghostscript fonts-dejavu-core
          python -m pip install Pillow numpy
      - name: Select plugin and audit
        env:
          PLUGIN_INPUT: ${{ github.event.inputs.plugin }}
          STRICT_INPUT: ${{ github.event.inputs.strict }}
          REFERENCES_INPUT: ${{ github.event.inputs.references }}
        run: |
          if [ -z "$PLUGIN_INPUT" ]; then
            PLUGIN_INPUT="plugins/T5577_multiwriter"
            echo "No plugin supplied; running default $PLUGIN_INPUT"
          fi
          case "$PLUGIN_INPUT" in
            plugins/*) ;;
            *) echo "Plugin must be under plugins/"; exit 2;;
          esac
          if [ ! -f "$PLUGIN_INPUT/ui.json" ]; then echo "Missing ui.json"; exit 2; fi
          args=("$PLUGIN_INPUT" --out ui-audit-report)
          if [ -n "$REFERENCES_INPUT" ]; then args+=(--references "$REFERENCES_INPUT"); fi
          if [ "$STRICT_INPUT" = "true" ]; then args+=(--strict); fi
          xvfb-run -a python tools/ui_audit/native_screen_audit.py "${args[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-ui-audit
          path: ui-audit-report/
          if-no-files-found: ignore
